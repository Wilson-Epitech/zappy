name: check_compilation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check_all:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: epitechcontent/epitest-docker:latest
      volumes:
        - ${{ github.workspace }}:/app

    steps:
    - uses: actions/checkout@v4

    - name: Check compilation
      run: |
          echo "## 🚀 Compilation result" >> $GITHUB_STEP_SUMMARY
          {
            set +e
            binaries=("zappy_server" "zappy_ai" "zappy_gui")
            for binary in "${binaries[@]}"; do
              make ADDITIONAL_FLAGS="-Werror"
              if [ $? -ne 0 ]; then
                echo "- ### Compilation of $binary failed ❌" >> $GITHUB_STEP_SUMMARY
                echo "Compilation of $binary failed."
                exit 1
              fi
            done
            echo "- ### Compilation succeed ✅" >> $GITHUB_STEP_SUMMARY
            exit 0
          }
