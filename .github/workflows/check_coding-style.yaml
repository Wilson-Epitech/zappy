name: check_coding-style

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  check_style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run coding style checker
        run: |
          cd server/
          bash ../.github/coding-style.sh . .
          lines=$(wc -l < coding-style-reports.log)
          if [ "$lines" -gt 0 ]; then
            echo "- ### $lines coding-style errors ❌" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "- ### $lines coding-style errors ✅" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
